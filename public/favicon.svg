<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- NOVA monogram. The two stems carry the wordmark's bone; the
       diagonal takes the champagne accent, which is the only thing that
       still reads as brand rather than as a letter at 16px. -->
  <rect width="32" height="32" rx="4" fill="#08090a" />
  <g stroke-width="2.8" stroke-linecap="square" fill="none">
    <path d="M9.6 24.5V7.5" stroke="#ede9e3" />
    <path d="M22.4 24.5V7.5" stroke="#ede9e3" />
    <path d="M9.6 7.5 22.4 24.5" stroke="#bc9a6a" />
  </g>
</svg>
